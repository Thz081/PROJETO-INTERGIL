name: intergil2026
services:
  mongo:
    networks: [banco-interno]
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "intergil", "--bind_ip_all"]
    volumes:
      - banco:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { if (e.code === 94) rs.initiate({_id:'intergil',members:[{_id:0,host:'mongo:27017'}]}); quit(1) }"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    networks: [banco-interno, site]
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env da raiz}
      MONGO_URI: mongodb://mongo:27017/intergil2026?replicaSet=intergil
      FIFA_CONTAGEM: ${FIFA_CONTAGEM:-pendente}
    volumes:
      - arquivos:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/modalidades').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
  web:
    networks: [site]
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INTERGIL_PORT:-8086}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  banco:
  arquivos:

networks:
  banco-interno:
    internal: true
  site:
