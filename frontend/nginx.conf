map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $uri $intergil_video {
    default "";
    ~^/midia-interna/[^/]+/video\.mp4$ intergil;
}
map $intergil_video $intergil_taxa_video {
    default 0;
    intergil 224k;
}
limit_conn_zone $intergil_video zone=intergil_videos:1m;

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 105m;
    location ~ ^/api/equipe/momentos/[^/]+/envios/[^/]+$ {
        client_max_body_size 4m;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }
    location ~ ^/api/acervo-momentos/[^/]+/arquivo/ {
        access_log off;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header X-Intergil-Entrega nginx;
    }
    location ^~ /midia-interna/ {
        internal;
        alias /srv/momentos/saida/;
        sendfile on;
        limit_conn intergil_videos 12;
        limit_conn_status 429;
        limit_rate $intergil_taxa_video;
        limit_rate_after 256k;
        max_ranges 1;
    }
    location ~ ^/(api|arquivos|uploads)/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
    location / { try_files $uri $uri/ /index.html; }
    location /images/ { try_files $uri =404; }
}
