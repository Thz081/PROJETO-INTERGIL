name: intergil2026
services:
  mongo:
    networks: [banco-interno]
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "intergil", "--bind_ip_all"]
    volumes:
      - banco:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { if (e.code === 94) rs.initiate({_id:'intergil',members:[{_id:0,host:'mongo:27017'}]}); quit(1) }"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    networks: [banco-interno, site]
    build: ./backend
    image: ${COMPOSE_PROJECT_NAME:-intergil2026}-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env da raiz}
      MONGO_URI: mongodb://mongo:27017/intergil2026?replicaSet=intergil
      MOMENTOS_ACERVO_MIB: ${MOMENTOS_ACERVO_MIB:-5120}
    volumes:
      - arquivos:/app/uploads
      - momentos:/app/momentos
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
  processador-momentos:
    image: ${COMPOSE_PROJECT_NAME:-intergil2026}-api
    pull_policy: never
    command: ["node", "src/edicao/processar-momentos.js"]
    restart: unless-stopped
    init: true
    cpus: 0.75
    mem_limit: 768m
    pids_limit: 64
    networks: [banco-interno]
    environment:
      MONGO_URI: mongodb://mongo:27017/intergil2026?replicaSet=intergil
    volumes:
      - momentos:/app/momentos
    depends_on:
      api:
        condition: service_healthy
  web:
    networks: [site]
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${INTERGIL_BIND:-127.0.0.1}:${INTERGIL_PORT:-8086}:80"
    volumes:
      - momentos:/srv/momentos:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  banco:
  arquivos:
  momentos:

networks:
  banco-interno:
    internal: true
  site:
